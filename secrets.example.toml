# Example only. Put real values in Streamlit Settings > Secrets.
# configure.py generates the complete file locally.
TIMEZONE = "America/Los_Angeles"

[dropbox]
app_key = "YOUR_DROPBOX_APP_KEY"
app_secret = "YOUR_DROPBOX_APP_SECRET"
refresh_token = "YOUR_DROPBOX_REFRESH_TOKEN"
# The supplied workbook link is the default. Override only if it changes.
# shared_link = "YOUR_DROPBOX_SHARED_LINK"
# If resolving the link fails, supply ONE exact location:
# file_path = "/Your folder/SpOps_ProjectCriticalPoints-Priorities.xlsx"
# file_id = "id:YOUR_DROPBOX_FILE_ID"
# Only when required for a Dropbox team space:
# root_namespace_id = "YOUR_TEAM_ROOT_NAMESPACE_ID"

[users.nathalie]
name = "Nathalie"
role = "editor"
password_hash = "GENERATE_WITH_configure.py"
